name: 🚀 Release & Changelog

on:
  push:
    tags:
      - "v*"              # 匹配 v0.0.0 格式的标签

jobs:
  release:
    name: 创建 Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 📄 生成 changelog 片段
        run: |
          echo "## 🚀 v${{ steps.version.outputs.VERSION }} 发布说明" > release_notes.md
          echo "" >> release_notes.md
          echo "**发布时间：** $(date '+%Y-%m-%d')" >> release_notes.md
          echo "" >> release_notes.md
          # 提取 CHANGELOG 中对应版本的内容
          if grep -q "## \[v${{ steps.version.outputs.VERSION }}\]" CHANGELOG.md; then
            awk "/## \[v${{ steps.version.outputs.VERSION }}\]/,/## \[" CHANGELOG.md | head -n -1 >> release_notes.md
          else
            echo "详见 [CHANGELOG.md](./CHANGELOG.md)" >> release_notes.md
          fi

      - name: 📦 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗑️ 清理
        run: rm release_notes.md

  # ----------------------------------------
  # 发布后自动更新 CHANGELOG.md 草稿（可选）
  # ----------------------------------------
  draft-changelog:
    name: 📝 更新 changelog 草稿
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push'

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ✏️ 创建 changelog 草稿 Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📝 Release v${process.env.VERSION} 复盘`,
              body: `## Release v${process.env.VERSION} 复盘\n\n### 完成项\n- [ ] \n\n### 待改进\n- [ ] \n\n### 下版本计划\n- [ ] `,
              labels: ["release", "documentation"]
            })
        env:
          VERSION: ${{ github.ref_name }}

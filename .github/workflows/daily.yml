name: 📊 Daily GitHub Trending Report

on:
  schedule:
    # 每天 UTC 01:00 (北京时间 09:00) 自动运行
    - cron: "0 1 * * *"
  workflow_dispatch:    # 允许手动触发
  push:
    branches:
      - main          # push 到 main 时也运行

jobs:
  generate-report:
    name: 生成并推送趋势报告
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🔑 配置 GitHub Token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" > ~/.github_token
          chmod 600 ~/.github_token

      - name: 📡 抓取 Trending 数据
        run: python3 scripts/fetch_trending.py

      - name: 📝 生成 MarkDown 报告
        run: python3 scripts/generate_report.py

      - name: 🚀 推送更新
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git diff --staged --quiet || git commit -m "📊 更新趋势报告 $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: ✅ 完成通知
        run: echo "✅ 今日趋势报告已更新！"
